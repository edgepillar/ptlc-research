name: Candidate 821bdd2 offline comparison

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci_scope:
    name: Candidate 821bdd2 scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      decision: ${{ steps.scope.outputs.decision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 64 || 1 }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Select scope using the unchanged trusted base policy
        id: scope
        env:
          PTLC_SCOPE_EVENT: ${{ github.event_name }}
          PTLC_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          PTLC_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PTLC_SCOPE_BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -eu
          python3 -I -B - <<'PY'
          import base64, hashlib, json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          event = os.environ['PTLC_SCOPE_EVENT']
          base, head = os.environ['PTLC_SCOPE_BASE'], os.environ['PTLC_SCOPE_HEAD']
          selected = dict(schema='ptlc-public-client-ci-scope-v1', mode='full',
              reason='EVENT_REQUIRES_FULL' if event != 'pull_request' else 'TRUSTED_BASE_POLICY_UNAVAILABLE',
              event=event, source_complete=False,
              qualification='NOT_PERFORMED', application='NO-GO', core='NO-GO')
          valid = lambda value: re.fullmatch('[0-9a-f]{40}', value) is not None and value != '0'*40
          selected.update(base=base if valid(base) else None, head=head if valid(head) else None,
              base_ref='main' if os.environ['PTLC_SCOPE_BASE_REF'] == 'main' else 'UNKNOWN')
          if event == 'pull_request' and valid(base) and valid(head) and os.environ['PTLC_SCOPE_BASE_REF'] == 'main':
              try:
                  original = subprocess.run(['git', '--no-lazy-fetch', '--no-replace-objects',
                      'show', base+':scripts/select_public_client_ci.py'], capture_output=True, timeout=30)
                  if original.returncode == 0 and original.stderr == b'' and 0 < len(original.stdout) <= 65536:
                      with tempfile.TemporaryDirectory(prefix='ptlc-base-policy-', dir=os.environ['RUNNER_TEMP']) as directory:
                          path = Path(directory)/'policy.py'; path.write_bytes(original.stdout)
                          result = subprocess.run([sys.executable, '-I', '-B', str(path), '--root', os.getcwd(),
                              '--event', event, '--base', base, '--head', head, '--base-ref', 'main'],
                              capture_output=True, timeout=45)
                          if result.returncode == 0 and result.stderr == b'' and 0 < len(result.stdout) <= 65536:
                              candidate = json.loads(result.stdout)
                              if (type(candidate) is dict and candidate.get('schema') == selected['schema']
                                      and candidate.get('mode') in ('full','public-client')
                                      and candidate.get('base') == base and candidate.get('head') == head):
                                  if (candidate['mode'] == 'full' or candidate.get('source_complete') is True
                                          and candidate.get('policy_sha256') == hashlib.sha256(original.stdout).hexdigest()):
                                      selected = candidate
              except (OSError, ValueError, subprocess.SubprocessError):
                  pass
          raw = json.dumps(selected, sort_keys=True).encode('ascii')
          assert len(raw) <= 65536
          print('PTLC_CI_SCOPE='+raw.decode('ascii'), flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as stream:
              stream.write('mode='+selected['mode']+'\n')
              stream.write('decision='+base64.b64encode(raw).decode('ascii')+'\n')
          PY

  nom-candidate-native:
    name: Candidate 821bdd2 native (Linux)
    needs: ci_scope
    if: ${{ !cancelled() && (needs.ci_scope.result != 'success' || needs.ci_scope.outputs.mode != 'public-client') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Admit one isolated current-source qualification workspace
        shell: bash
        run: |
          set -eu
          umask 077
          python3 -B - <<'PY'
          import os, shutil
          from qualification import nom_dev_821bdd2 as selected
          selected.frozen_plan()
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 14 * 1024**3
          print('PASS: complete current selection and finite workspace admission')
          PY
          ptlc_candidate_root="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-821.XXXXXX")"
          chmod 700 "$ptlc_candidate_root"
          mkdir -m 700 "$ptlc_candidate_root/workspace" "$ptlc_candidate_root/toolchain" "$ptlc_candidate_root/inputs"
          printf 'PTLC_NOM_821_ROOT=%s\n' "$ptlc_candidate_root" >> "$GITHUB_ENV"
      - name: Install one bounded pinned Go toolchain
        shell: bash
        run: |
          set -eu
          umask 077
          test "$(uname -m)" = x86_64
          ptlc_candidate_go_archive="$PTLC_NOM_821_ROOT/go.tar.gz"
          (
            ulimit -f 131072
            curl --disable --fail --silent --show-error --location --max-redirs 2 \
              --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 134217728 \
              https://go.dev/dl/go1.23.12.linux-amd64.tar.gz --output "$ptlc_candidate_go_archive"
          )
          printf '%s  %s\n' d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90 "$ptlc_candidate_go_archive" | sha256sum --check
          tar -xzf "$ptlc_candidate_go_archive" -C "$PTLC_NOM_821_ROOT/toolchain"
          printf '%s\n' "$PTLC_NOM_821_ROOT/toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Prepare the exact current 548-file source view once
        shell: bash
        run: |
          set -eu
          umask 077
          ptlc_candidate_archive="$PTLC_NOM_821_ROOT/source.zip"
          test ! -e "$ptlc_candidate_archive"
          (
            ulimit -f 8192
            curl --disable --fail --silent --show-error --location --max-redirs 2 \
              --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 2072870 \
              https://api.github.com/repos/zenon-network/go-zenon/zipball/821bdd25eabacbf8a07b6310986f38713f27b4e3 \
              --output "$ptlc_candidate_archive"
          )
          python3 -B scripts/prepare_nom_821bdd2.py --archive "$ptlc_candidate_archive" \
            --destination "$PTLC_NOM_821_ROOT/source"
      - name: Acquire dependencies from separate unchanged module inputs
        timeout-minutes: 10
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOENV: "off"
          GODEBUG: "http2client=0"
        shell: bash
        run: |
          set -eu
          umask 077
          cp "$PTLC_NOM_821_ROOT/source/go.mod" "$PTLC_NOM_821_ROOT/source/go.sum" "$PTLC_NOM_821_ROOT/inputs/"
          export GOPATH="$PTLC_NOM_821_ROOT/bootstrap-path"
          export GOMODCACHE="$PTLC_NOM_821_ROOT/bootstrap-modules"
          export GOCACHE="$PTLC_NOM_821_ROOT/bootstrap-build"
          export GOPROXY='https://proxy.golang.org' GOSUMDB='sum.golang.org' GOVCS='*:off'
          export GOPRIVATE='' GONOPROXY='none' GONOSUMDB='none'
          (
            ulimit -f 131072
            cd "$PTLC_NOM_821_ROOT/inputs"
            go mod download all
            go mod verify
          )
          python3 -B - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from qualification import nom_dev_821bdd2 as selected
          unused, index = selected.inputs()
          root = Path(os.environ['PTLC_NOM_821_ROOT'])
          # Go may populate checksums in the isolated bootstrap copy. The source
          # and requirement file remain exact; no original checksum may change.
          def checksum_entries(raw):
              assert type(raw) is bytes and 0 < len(raw) <= 2 * 1024**2
              assert raw.isascii() and raw.endswith(b'\n')
              result = {}
              for line in raw.splitlines():
                  fields = line.split(b' ')
                  assert len(fields) == 3 and all(fields)
                  assert not any(b'\t' in field or b'\r' in field or b'\0' in field for field in fields)
                  key = tuple(fields[:2]); digest = fields[2]
                  assert key not in result and digest.startswith(b'h1:')
                  decoded = base64.b64decode(digest[3:], validate=True)
                  assert len(decoded) == 32 and base64.b64encode(decoded) == digest[3:]
                  result[key] = digest
              return result
          source = {name: (root / 'source' / name).read_bytes() for name in ('go.mod', 'go.sum')}
          bootstrap = {name: (root / 'inputs' / name).read_bytes() for name in source}
          for name, raw in source.items():
              assert hashlib.sha256(raw).hexdigest() == index[name]['sha256'], 'source module pin changed'
          assert bootstrap['go.mod'] == source['go.mod'], 'bootstrap requirements changed'
          original = checksum_entries(source['go.sum'])
          expanded = checksum_entries(bootstrap['go.sum'])
          assert all(expanded.get(key) == value for key, value in original.items()), 'original checksum changed or missing'
          print(json.dumps(dict(schema='ptlc-nom-821bdd2-bootstrap-inputs-v1',
              source_files_unchanged=True, bootstrap_requirements_unchanged=True,
              original_checksum_entries=len(original), added_checksum_entries=len(set(expanded) - set(original)),
              source_go_sum_sha256=index['go.sum']['sha256'],
              bootstrap_go_sum_sha256=hashlib.sha256(bootstrap['go.sum']).hexdigest(),
              dependency_authentication='SEPARATE GO COMMANDS; NOT ESTABLISHED BY THIS INPUT CHECK',
              application='NO-GO', core='NO-GO'), sort_keys=True))
          print('PASS: immutable source pins and append-only bootstrap checksums')
          PY
          ptlc_candidate_proxy="$(go env GOMODCACHE)/cache/download"
          ptlc_candidate_proxy="$(python3 -B -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True))' "$ptlc_candidate_proxy")"
          test -d "$ptlc_candidate_proxy"
          printf 'PTLC_NOM_821_PROXY=%s\n' "$ptlc_candidate_proxy" >> "$GITHUB_ENV"
      - name: Compare all thirty-seven profiles in two stages with one fresh cache offline
        id: nom_current_native
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        shell: bash
        run: |
          set -eu
          umask 077
          ptlc_candidate_go="$(command -v go)"
          ptlc_candidate_go_sha="$(sha256sum "$ptlc_candidate_go" | cut -d ' ' -f 1)"
          ptlc_candidate_cc="$(readlink -f "$(command -v cc)")"
          python3 -B scripts/qualify_nom_821bdd2_bundle.py \
            --source "$PTLC_NOM_821_ROOT/source" \
            --workspace "$PTLC_NOM_821_ROOT/workspace" --go "$ptlc_candidate_go" \
            --expect-go-sha256 "$ptlc_candidate_go_sha" --cc "$ptlc_candidate_cc" \
            --offline-proxy "$PTLC_NOM_821_PROXY"
      - name: Select exact current originals including incomplete attempts
        id: nom_current_selection
        if: always() && steps.nom_current_native.outcome != 'skipped'
        shell: bash
        run: |
          set -eu
          ptlc_candidate_paths="$(python3 -B scripts/check_nom_821bdd2_bundle.py \
            --workspace "$PTLC_NOM_821_ROOT/workspace" \
            --allow-incomplete-for-retention --artifact-files)"
          {
            printf 'files<<PTLC_CURRENT_ORIGINALS\n'
            while IFS= read -r ptlc_candidate_name; do
              printf '%s/workspace/%s\n' "$PTLC_NOM_821_ROOT" "$ptlc_candidate_name"
            done <<< "$ptlc_candidate_paths"
            printf 'PTLC_CURRENT_ORIGINALS\n'
          } >> "$GITHUB_OUTPUT"
      - name: Retain explicit current originals with no caches or private argv
        if: always() && steps.nom_current_selection.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-821bdd2-source-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.nom_current_selection.outputs.files }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          archive: true

  ci_acceptance:
    name: Candidate 821bdd2 acceptance
    needs: [ci_scope, nom-candidate-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected candidate execution or explicit nonexecution
        env:
          PTLC_CANDIDATE_NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -eu
          python3 -I -B - <<'PY'
          import json, os
          needs = json.loads(os.environ['PTLC_CANDIDATE_NEEDS'])
          assert set(needs) == {'ci_scope', 'nom-candidate-native'}
          scope, candidate = needs['ci_scope'], needs['nom-candidate-native']
          assert scope['result'] == 'success'
          mode = scope['outputs']['mode']
          assert mode in ('full', 'public-client')
          if mode == 'full':
              assert candidate == dict(result='success', outputs={})
              execution = 'SELECTED_JOB_PASSED; ORIGINAL_VALUE_ACCEPTANCE_SEPARATE'
          else:
              assert candidate == dict(result='skipped', outputs={})
              execution = 'NOT_SELECTED; NO_NATIVE_COMPATIBILITY_CLAIM'
          print('PTLC_NOM_821_CANDIDATE_ACCEPTANCE='+json.dumps(dict(
              schema='ptlc-nom-821bdd2-hosted-selection-v1', mode=mode,
              execution=execution, artifact_value_acceptance='NOT_PERFORMED_BY_SELECTION_GATE',
              journal_source_upgrade='NOT_SELECTED', application='NO-GO', core='NO-GO',
              independent_assessment='UNFILLED'), sort_keys=True))
          PY
