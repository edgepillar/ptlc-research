name: Candidate 008bdcd finite offline comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nom-008bdcd-native.yml'
      - 'qualification/nom_dev_008bdcd_*.py'
      - 'scripts/qualify_nom_008bdcd_native.py'
      - 'scripts/prepare_nom_18c048a.py'
      - 'scripts/nom_18c048a_command.py'
      - 'scripts/qualify_nom_18c048a_native.py'
      - 'compatibility/nom_dev_008bdcd_source_delta_v1.json'
      - 'compatibility/core_overlay_test.go.txt'
      - 'compatibility/fixtures/pr138_*.json'
      - 'compatibility/fixtures/nom_terms_v1.json'
      - 'compatibility/fixtures/nom_completions_v1.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nom-008bdcd-native.yml'
      - 'qualification/nom_dev_008bdcd_*.py'
      - 'scripts/qualify_nom_008bdcd_native.py'
      - 'scripts/prepare_nom_18c048a.py'
      - 'scripts/nom_18c048a_command.py'
      - 'scripts/qualify_nom_18c048a_native.py'
      - 'compatibility/nom_dev_008bdcd_source_delta_v1.json'
      - 'compatibility/core_overlay_test.go.txt'
      - 'compatibility/fixtures/pr138_*.json'
      - 'compatibility/fixtures/nom_terms_v1.json'
      - 'compatibility/fixtures/nom_completions_v1.json'

permissions:
  contents: read

jobs:
  finite-native:
    name: Candidate 008bdcd selected native roots (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PTLC_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Admit one workspace and acquire pinned inputs
        shell: bash
        run: |
          set -eu
          umask 077
          test "$(uname -m)" = x86_64
          python3 -B -c 'import os, shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 13*1024**3'
          candidate="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-008.XXXXXX")"
          mkdir -m 700 "$candidate/workspace" "$candidate/toolchain"
          (
            ulimit -f 131072
            curl --disable --fail --silent --show-error --location --max-redirs 2 \
              --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 134217728 \
              https://go.dev/dl/go1.23.12.linux-amd64.tar.gz --output "$candidate/go.tar.gz"
          )
          printf '%s  %s\n' d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90 "$candidate/go.tar.gz" | sha256sum --check --status
          tar -xzf "$candidate/go.tar.gz" -C "$candidate/toolchain"
          (
            ulimit -f 8192
            curl --disable --fail --silent --show-error --location --max-redirs 2 \
              --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 2209732 \
              https://api.github.com/repos/zenon-network/go-zenon/zipball/008bdcd60f65923952f27a9d9a8c39fba7254a21 \
              --output "$candidate/source.zip"
          )
          printf 'PTLC_CANDIDATE_ROOT=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Acquire selected dependencies and run one offline native comparison
        id: native
        shell: bash
        run: |
          set -eu
          go="$PTLC_CANDIDATE_ROOT/toolchain/go/bin/go"
          go_sha="$(sha256sum "$go" | cut -d ' ' -f 1)"
          cc="$(readlink -f "$(command -v cc)")"
          python3 -B scripts/qualify_nom_008bdcd_native.py \
            --archive "$PTLC_CANDIDATE_ROOT/source.zip" --workspace "$PTLC_CANDIDATE_ROOT/workspace" \
            --go "$go" --expect-go-sha256 "$go_sha" --cc "$cc" --head "$PTLC_CANDIDATE_HEAD"
      - name: Select safe original streams and result
        id: originals
        if: always() && steps.native.outcome != 'skipped'
        shell: bash
        run: |
          set -eu
          files="$(python3 -B scripts/qualify_nom_008bdcd_native.py \
            --workspace "$PTLC_CANDIDATE_ROOT/workspace" --head "$PTLC_CANDIDATE_HEAD" --artifact-files)"
          {
            printf 'files<<PTLC_ORIGINALS\n'
            while IFS= read -r name; do
              printf '%s/workspace/%s\n' "$PTLC_CANDIDATE_ROOT" "$name"
            done <<< "$files"
            printf 'PTLC_ORIGINALS\n'
          } >> "$GITHUB_OUTPUT"
      - name: Retain selected originals
        if: always() && steps.originals.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-008bdcd-native-linux-${{ env.PTLC_CANDIDATE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.originals.outputs.files }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
