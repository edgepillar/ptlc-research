name: Offline research checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch immutable observation review source objects
        run: git fetch --no-tags --depth=1 origin f81e376e96e339647bb065739b4461235f865d2c e592633e4c630cfe3f4669876f6f63b80d2e33d6
      - name: Check pinned observation review inventory
        run: python3 -B scripts/check_observation_subject.py --expect-commit f81e376e96e339647bb065739b4461235f865d2c
      - name: Acquire and inspect pinned witness review source
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          python3 -B scripts/check_witness_subject.py --expect-commit bd4b4b523fb3453e2af191eb01973985d6431d66 --expect-manifest-sha256 0f449db4c5e7c65f826ab57c4fafe4cd288bb570b7920d29e583b6cfd62dd82f
      - name: Acquire and inspect pinned worker-profile review source
        run: |
          git fetch --no-tags --depth=1 origin a80d14f1bc223e7d20901837fe84804fc7c1bce5
          python3 -B scripts/check_worker_review_subject.py --expect-commit a80d14f1bc223e7d20901837fe84804fc7c1bce5 --expect-manifest-sha256 f140380fe8c2a11387316c5b8ed7269cdce239f89592ded26588decf1c42c75e
      - name: Select macOS OpenSSL verifier
        if: runner.os == 'macOS'
        run: |
          verifier_prefix="$(brew --prefix openssl@3)"
          test -x "$verifier_prefix/bin/openssl"
          printf '%s/bin\n' "$verifier_prefix" >> "$GITHUB_PATH"
      - name: Run offline regression and independent verification
        env:
          REQUIRE_OPENSSL: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Check artifact hygiene
        run: python3 scripts/check_artifacts.py
      - name: Compare missing NoM original custody without reconstruction
        run: python3 -B scripts/qualify_nom_partial_custody.py
      - name: Compare selected NoM uncertainty retention without recovery admission
        run: python3 -B scripts/qualify_nom_uncertainty.py
      - name: Compare source policy and protected-use cutoffs
        run: |
          set -eu
          for policy in cached-read commit-cutoff entry-cutoff rollbackable-ledger; do
            python3 -B scripts/model_policy_source_use.py --policy "$policy"
            python3 -B scripts/model_policy_source_use.py --policy "$policy" --distinct-operations
          done
      - name: Compare original-read delivery and ideal entry boundaries
        run: |
          set -eu
          for use in no-entry receipt-entry ideal-current-entry; do
            python3 -B scripts/model_original_read_provenance.py --use "$use"
          done
      - name: Compare bounded original-read consumer retention
        run: |
          set -eu
          for policy in replace-witness retained-prefix ideal-nonrollback-prefix; do
            python3 -B -m scripts.model_original_consumer_retention --policy "$policy"
          done
      - name: Record isolated policy-store SQLite runtime
        run: python3 -B -m qualification.policy_effect_store

  adaptor-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Fetch locked qualification dependencies
        run: cargo +1.90.0 fetch --locked --manifest-path qualification/Cargo.toml
      - name: Run offline adaptor qualification
        run: cargo +1.90.0 test --locked --offline --manifest-path qualification/Cargo.toml
      - name: Qualify separate public-synthetic native partial journal handoff
        run: cargo +1.90.0 test --locked --offline --manifest-path qualification-native-partial/Cargo.toml
      - name: Build public artifact, completion, authentication, enrollment and observation executables
        run: cargo +1.90.0 build --locked --offline --manifest-path qualification/Cargo.toml --examples
      - name: Qualify fixed-recipient NoM original recovery with the public worker
        run: python3 -B scripts/qualify_nom_recovery.py
      - name: Qualify actual public-worker reference-journal interruption custody
        run: python3 -B scripts/qualify_nom_recovery_cuts.py
      - name: Qualify explicit reference-journal process death with the public worker
        run: python3 -B scripts/qualify_nom_process_death.py
      - name: Qualify selected strict read-only result verification with the public worker
        run: python3 -B scripts/qualify_nom_strict_open.py
      - name: Qualify read-only journal partial HOLD projection with the public worker
        run: python3 -B scripts/qualify_nom_journal_hold.py
      - name: Qualify create-only full projection capsule custody with the public worker
        run: python3 -B scripts/qualify_nom_capsule.py
      - name: Compare retained capsule journal continuity with the public worker
        run: python3 -B scripts/qualify_nom_capsule_continuity.py
      - name: Bind retained capsule originals and unknown work to the separate source read
        run: python3 -B scripts/qualify_nom_capsule_query.py
      - name: Verify historical NoM source and custody role signatures
        run: python3 -B scripts/qualify_nom_source_checkpoint.py
      - name: Compare selected NoM external checkpoint reference transitions
        run: python3 -B scripts/qualify_nom_checkpoint_protocol.py
      - name: Compare minimum-bound NoM checkpoint discovery and complete evidence openings
        run: python3 -B scripts/qualify_nom_checkpoint_discovery.py
      - name: Qualify public recovery with computed Create context ids
        run: python3 -B scripts/qualify_nom_created_recovery.py
      - name: Record selected offline dependency and worker input evidence
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          ptlc_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_cc="$(command -v cc)"
          python3 -B scripts/qualify_build_inputs.py --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --cargo "$ptlc_cargo" --rustc "$ptlc_rustc" --c-compiler "$ptlc_cc" --original-response-worker qualification/target/debug/examples/verify_original_read_response
      - name: Compare locked Cargo archives and pinned Git checkout contents
        run: python3 -B scripts/qualify_dependency_contents.py --cargo-home "${CARGO_HOME:-$HOME/.cargo}"
      - name: Compare selected Cargo resolution records against fixed source baseline
        run: |
          ptlc_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          ptlc_resolution_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_resolution_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          for ptlc_platform in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            ptlc_resolution_workspace="$(mktemp -d "$RUNNER_TEMP/ptlc-cargo-resolution.XXXXXX")"
            python3 -B scripts/prepare_cargo_resolution.py --output "$ptlc_resolution_workspace"
            CARGO_HOME="$ptlc_cargo_home" CARGO_NET_OFFLINE=true RUSTC="$ptlc_resolution_rustc" \
              "$ptlc_resolution_cargo" metadata --locked --offline --format-version 1 \
              --manifest-path "$ptlc_resolution_workspace/qualification/Cargo.toml" \
              --filter-platform "$ptlc_platform" > "$ptlc_resolution_workspace/metadata.json"
            python3 -B scripts/qualify_cargo_resolution.py --workspace "$ptlc_resolution_workspace" \
              --metadata "$ptlc_resolution_workspace/metadata.json" \
              --cargo-home "$ptlc_cargo_home" --platform "$ptlc_platform"
          done
      - name: Compare fresh selected worker build claims and exercise its public math
        run: |
          set -eu
          ptlc_worker_workspace="$(mktemp -d "$RUNNER_TEMP/ptlc-worker-source.XXXXXX")"
          ptlc_worker_build="$(mktemp -d "$RUNNER_TEMP/ptlc-worker-build.XXXXXX")"
          ptlc_worker_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_worker_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_worker_cc="$(command -v cc)"
          python3 -B scripts/qualify_worker_build.py --workspace "$ptlc_worker_workspace" \
            --build-directory "$ptlc_worker_build" --cargo-home "${CARGO_HOME:-$HOME/.cargo}" \
            --platform x86_64-unknown-linux-gnu --cargo "$ptlc_worker_cargo" \
            --rustc "$ptlc_worker_rustc" --c-compiler "$ptlc_worker_cc"
          python3 -B scripts/qualify_original_read_response.py \
            --original-response-verifier "$ptlc_worker_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
      - name: Compare two target-only Rust remapping builds and their separate public math
        run: |
          set -eu
          set -o pipefail
          ptlc_section_carrier="$(mktemp "$RUNNER_TEMP/ptlc-section-carrier.XXXXXX")"
          trap 'rm -f "$ptlc_section_carrier"' EXIT
          ptlc_remap_first_source="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-source-a.XXXXXX")"
          ptlc_remap_first_build="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-build-a.XXXXXX")"
          ptlc_remap_second_source="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-source-b.XXXXXX")"
          ptlc_remap_second_build="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-build-b.XXXXXX")"
          ptlc_remap_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_remap_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_remap_cc="$(command -v cc)"
          python3 -B scripts/qualify_worker_remapping.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_remap_cargo" --rustc "$ptlc_remap_rustc" --c-compiler "$ptlc_remap_cc" | tee "$ptlc_section_carrier"
          for ptlc_remap_build in "$ptlc_remap_first_build" "$ptlc_remap_second_build"; do
            python3 -B scripts/qualify_original_read_response.py \
              --original-response-verifier "$ptlc_remap_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
          done
          python3 -B scripts/qualify_worker_sections.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          python3 -B scripts/qualify_worker_symbols.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          python3 -B scripts/qualify_worker_debug_names.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          ptlc_c_carrier="$(mktemp "$RUNNER_TEMP/ptlc-c-carrier.XXXXXX")"
          chmod 600 "$ptlc_c_carrier"
          trap 'rm -f "$ptlc_section_carrier" "$ptlc_c_carrier"' EXIT
          ptlc_c_first_source="$(mktemp -d "$RUNNER_TEMP/ptlc-c-source-a.XXXXXX")"
          ptlc_c_first_build="$(mktemp -d "$RUNNER_TEMP/ptlc-c-build-a.XXXXXX")"
          ptlc_c_second_source="$(mktemp -d "$RUNNER_TEMP/ptlc-c-source-b.XXXXXX")"
          ptlc_c_second_build="$(mktemp -d "$RUNNER_TEMP/ptlc-c-build-b.XXXXXX")"
          python3 -B scripts/qualify_worker_c_debug.py \
            --first-workspace "$ptlc_c_first_source" --first-build-directory "$ptlc_c_first_build" \
            --second-workspace "$ptlc_c_second_source" --second-build-directory "$ptlc_c_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_remap_cargo" --rustc "$ptlc_remap_rustc" --c-compiler "$ptlc_remap_cc" | tee "$ptlc_c_carrier"
          for ptlc_c_build in "$ptlc_c_first_build" "$ptlc_c_second_build"; do
            python3 -B scripts/qualify_original_read_response.py \
              --original-response-verifier "$ptlc_c_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
          done
          python3 -B scripts/qualify_worker_c_symbols.py \
            --first-workspace "$ptlc_c_first_source" --first-build-directory "$ptlc_c_first_build" \
            --second-workspace "$ptlc_c_second_source" --second-build-directory "$ptlc_c_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_c_carrier"
      - name: Qualify durable exchange with the actual public verifier
        run: python3 -B scripts/qualify_exchange.py --verifier qualification/target/debug/examples/verify_exchange
      - name: Qualify public completion and recovery with separate journals
        run: python3 -B scripts/qualify_completion.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify pinned completion envelopes and their admission limits
        run: python3 -B scripts/qualify_authentication.py --authentication qualification/target/debug/examples/verify_authentication --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify public enrollment signatures and their authority limits
        run: python3 -B scripts/qualify_enrollment_signature.py --enrollment qualification/target/debug/examples/verify_enrollment --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify local governor profiles and their bootstrap limits
        run: python3 -B scripts/qualify_governor_profile.py --enrollment qualification/target/debug/examples/verify_enrollment --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify public issuer and v2 owner signatures without current authority
        run: python3 -B scripts/qualify_governor_signature.py --governor qualification/target/debug/examples/verify_governor --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Replay selected recovery model traces against actual public workers
        run: python3 -B scripts/qualify_recovery_model.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify exact normal observation verdicts and unavailable work
        run: python3 -B scripts/qualify_observation.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify bounded observation records with actual verdicts and unknown work
        run: python3 -B scripts/qualify_observation_records.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify separately owned observation storage and actual result-loss recovery
        run: python3 -B scripts/qualify_observation_store.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify explicit Linux CPU and address-space limits with actual observation work
        run: python3 -B scripts/qualify_worker_resources.py --verifier qualification/target/debug/examples/verify_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify durable Linux policy, death, storage failures and restore limits
        run: python3 -B scripts/qualify_observation_resource_store.py --verifier qualification/target/debug/examples/verify_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify selected historical source root roles without provisioning
        run: python3 -B scripts/qualify_source_root_roles.py --root-verifier qualification/target/debug/examples/verify_source_root
      - name: Qualify selected historical administrator commands without source mutation
        run: python3 -B scripts/qualify_source_admin_command.py --admin-verifier qualification/target/debug/examples/verify_source_admin
      - name: Qualify selected checkpoint response signatures without current authority
        run: python3 -B scripts/qualify_source_response.py --response-verifier qualification/target/debug/examples/verify_source_response
      - name: Qualify selected historical original-read root and response signatures
        run: python3 -B scripts/qualify_original_read_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only owned original snapshots with historical signature mathematics
        run: python3 -B scripts/qualify_original_read_snapshot_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only signed retained prefixes and forked futures
        run: python3 -B scripts/qualify_original_snapshot_prefix_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only owned witness transactions and copied-state limits
        run: python3 -B scripts/qualify_original_witness_store.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only witness creation and interruption lifecycle
        run: python3 -B scripts/qualify_original_witness_lifecycle.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Check Rust formatting
        run: cargo +1.90.0 fmt --manifest-path qualification/Cargo.toml -- --check
      - name: Check separate public-synthetic handoff formatting
        run: cargo +1.90.0 fmt --manifest-path qualification-native-partial/Cargo.toml -- --check

  nom-worker-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Acquire and check the separate immutable NoM worker source
        run: |
          git fetch --no-tags --depth=1 origin c560f5dc504818252703fdeaecc2ff96a3f86059
          python3 -B scripts/check_nom_worker_subject.py \
            --expect-commit c560f5dc504818252703fdeaecc2ff96a3f86059 \
            --expect-manifest-sha256 59d9b134d4be55f3dc98797529aff86d121fdce3d0e2ddce8dfd7b9c171cf179
      - name: Acquire selected native toolchain and locked dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path qualification/Cargo.toml
      - name: Build fresh native NoM worker and exercise empty-environment public recovery
        run: |
          set -eu
          umask 077
          ptlc_nom_source="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-source.XXXXXX")"
          ptlc_nom_build="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-build.XXXXXX")"
          ptlc_nom_evidence="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-evidence.XXXXXX")"
          ptlc_nom_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_nom_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_nom_cc="$(command -v cc)"
          python3 -B scripts/qualify_nom_worker.py --workspace "$ptlc_nom_source" \
            --build-directory "$ptlc_nom_build" --evidence "$ptlc_nom_evidence" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_nom_cargo" --rustc "$ptlc_nom_rustc" --c-compiler "$ptlc_nom_cc"

  go-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [qualification-go, qualification-bitcoin-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned compatibility toolchain
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/ptlc-go.tar.gz"
          curl --fail --silent --show-error --location https://go.dev/dl/go1.23.12.linux-amd64.tar.gz --output "$archive"
          printf '%s  %s\n' d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90 "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ptlc-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ptlc-go"
          printf '%s\n' "$RUNNER_TEMP/ptlc-go/go/bin" >> "$GITHUB_PATH"
      - name: Fetch recorded Go dependencies
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
        run: |
          ptlc_module_copy="$(mktemp -d "$RUNNER_TEMP/ptlc-go-inputs.XXXXXX")"
          cp go.mod go.sum "$ptlc_module_copy/"
          (
            cd "$ptlc_module_copy"
            go mod download all
          )
      - name: Run offline Go qualification
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test -mod=readonly -count=1 -v ./...
      - name: Compare declared Go module contents against fixed sums
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          ptlc_go_cache="$(go env GOMODCACHE)"
          python3 -B scripts/qualify_dependency_contents.py --go-cache "$ptlc_go_cache" --go-module "${{ matrix.module }}"
      - name: Check Go formatting
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"


  macho-object-prefix:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Prepare separate locked native qualification inputs
        run: |
          mkdir -p .research-cache/macho-cargo-home
          ptlc_macho_home="$GITHUB_WORKSPACE/.research-cache/macho-cargo-home"
          CARGO_HOME="$ptlc_macho_home" cargo +1.90.0 fetch --locked --manifest-path qualification/Cargo.toml
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
      - name: Compare separate native Apple object-prefix builds and public math
        run: |
          set -eu
          ptlc_macho_home="$GITHUB_WORKSPACE/.research-cache/macho-cargo-home"
          ptlc_macho_first_source="$(mktemp -d "$GITHUB_WORKSPACE/.research-cache/ptlc-macho-source-a.XXXXXX")"
          ptlc_macho_first_build="$(mktemp -d "$GITHUB_WORKSPACE/.research-cache/ptlc-macho-build-a.XXXXXX")"
          ptlc_macho_second_source="$(mktemp -d "$GITHUB_WORKSPACE/.research-cache/ptlc-macho-source-b.XXXXXX")"
          ptlc_macho_second_build="$(mktemp -d "$GITHUB_WORKSPACE/.research-cache/ptlc-macho-build-b.XXXXXX")"
          ptlc_macho_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_macho_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_macho_cc="$(command -v cc)"
          python3 -B scripts/qualify_worker_macho_prefix.py \
            --first-workspace "$ptlc_macho_first_source" --first-build-directory "$ptlc_macho_first_build" \
            --second-workspace "$ptlc_macho_second_source" --second-build-directory "$ptlc_macho_second_build" \
            --cargo-home "$ptlc_macho_home" --platform aarch64-apple-darwin \
            --cargo "$ptlc_macho_cargo" --rustc "$ptlc_macho_rustc" --c-compiler "$ptlc_macho_cc" \
            --object-prefix "$GITHUB_WORKSPACE/"
          for ptlc_macho_build in "$ptlc_macho_first_build" "$ptlc_macho_second_build"; do
            python3 -B scripts/qualify_original_read_response.py \
