name: Offline research checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nom-anchor-sqlite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine-platform: linux
          - os: macos-latest
            engine-platform: darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Admit a new finite hosted qualification workspace
        id: workspace
        shell: bash
        run: |
          set -eu
          ptlc_sqlite_root="$(mktemp -d "$RUNNER_TEMP/ptlc-sqlite.XXXXXX")"
          chmod 700 "$ptlc_sqlite_root"
          mkdir "$ptlc_sqlite_root/temporary"
          chmod 700 "$ptlc_sqlite_root/temporary"
          printf 'PTLC_SQLITE_JOB_ROOT=%s\n' "$ptlc_sqlite_root" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s/temporary\n' "$ptlc_sqlite_root" >> "$GITHUB_ENV"
          cd "$ptlc_sqlite_root"
          python3 -B - <<'PY'
          import json
          import shutil
          floor, reservation = 10 * 1024**3, 1024**3
          if shutil.disk_usage('.').free < floor + reservation:
              raise SystemExit('REFUSED: finite hosted workspace free-space admission')
          print(json.dumps(dict(scope='NEW ISOLATED HOSTED JOB ONLY', free_space_floor=floor,
              expected_reservation=reservation, evidence_limit=128*1024**2,
              database_fixture_limit=256*1024**2, os_filesystem_quota='NOT CLAIMED')))
          PY
      - name: Acquire one bounded pinned SQLite source archive
        shell: bash
        run: |
          set -eu
          cd "$PTLC_SQLITE_JOB_ROOT"
          curl --disable --fail --silent --show-error --location --max-redirs 2 \
            --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 2990479 \
            --output selected-source.zip https://www.sqlite.org/2026/sqlite-amalgamation-3540000.zip
      - name: Build and identity-probe the exact offline engine
        shell: bash
        run: |
          set -eu
          ptlc_sqlite_cc="$(command -v cc)"
          python3 -B scripts/prepare_nom_anchor_sqlite_engine.py \
            --source-archive "$PTLC_SQLITE_JOB_ROOT/selected-source.zip" \
            --output-directory "$PTLC_SQLITE_JOB_ROOT/engine" --c-compiler "$ptlc_sqlite_cc" \
            --ci-transcript
      - name: Compare complete reference bytes and actual native failure cuts
        id: native
        shell: bash
        run: |
          set -eu
          python3 -B - <<'PY'
          import os
          import shutil
          if shutil.disk_usage(os.environ['PTLC_SQLITE_JOB_ROOT']).free < 11*1024**3:
              raise SystemExit('REFUSED: native comparison free-space admission')
          PY
          python3 -B scripts/qualify_nom_anchor_sqlite.py \
            --sqlite-cli "$PTLC_SQLITE_JOB_ROOT/engine/sqlite3" \
            --engine-record "$PTLC_SQLITE_JOB_ROOT/engine/engine.json" \
            --evidence-directory "$PTLC_SQLITE_JOB_ROOT/evidence"
      - name: Review original graph and sharing before retention
        id: output-check
        if: always() && steps.workspace.outcome == 'success'
        shell: bash
        run: |
          set -eu
          if [ '${{ steps.native.outcome }}' = 'success' ]; then
            python3 -B scripts/check_nom_anchor_sqlite_evidence.py \
              --evidence-directory "$PTLC_SQLITE_JOB_ROOT/evidence" \
              --expect-platform '${{ matrix.engine-platform }}'
          else
            python3 -B scripts/check_nom_anchor_sqlite_evidence.py \
              --evidence-directory "$PTLC_SQLITE_JOB_ROOT/evidence" --allow-incomplete-for-retention
          fi
      - name: Preserve this attempt's checked synthetic originals
        if: always() && steps.output-check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-anchor-sqlite-${{ runner.os }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.PTLC_SQLITE_JOB_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          archive: true

  offline-tests:
    name: offline-tests (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.13", shard: "1"}
          - {os: ubuntu-latest, python-version: "3.13", shard: "0"}
          - {os: macos-latest, python-version: "3.13", shard: "2"}
          - {os: macos-latest, python-version: "3.13", shard: "1"}
          - {os: macos-latest, python-version: "3.11", shard: "3"}
          - {os: macos-latest, python-version: "3.13", shard: "3"}
          - {os: macos-latest, python-version: "3.11", shard: "1"}
          - {os: ubuntu-latest, python-version: "3.11", shard: "1"}
          - {os: ubuntu-latest, python-version: "3.13", shard: "3"}
          - {os: ubuntu-latest, python-version: "3.11", shard: "2"}
          - {os: ubuntu-latest, python-version: "3.11", shard: "0"}
          - {os: ubuntu-latest, python-version: "3.13", shard: "2"}
          - {os: macos-latest, python-version: "3.11", shard: "0"}
          - {os: ubuntu-latest, python-version: "3.11", shard: "3"}
          - {os: macos-latest, python-version: "3.11", shard: "2"}
          - {os: macos-latest, python-version: "3.13", shard: "0"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch immutable observation review source objects
        run: git fetch --no-tags --depth=1 origin f81e376e96e339647bb065739b4461235f865d2c e592633e4c630cfe3f4669876f6f63b80d2e33d6
      - name: Check pinned observation review inventory
        run: python3 -B scripts/check_observation_subject.py --expect-commit f81e376e96e339647bb065739b4461235f865d2c
      - name: Acquire and inspect pinned witness review source
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          python3 -B scripts/check_witness_subject.py --expect-commit bd4b4b523fb3453e2af191eb01973985d6431d66 --expect-manifest-sha256 0f449db4c5e7c65f826ab57c4fafe4cd288bb570b7920d29e583b6cfd62dd82f
      - name: Acquire and inspect pinned worker-profile review source
        run: |
          git fetch --no-tags --depth=1 origin a80d14f1bc223e7d20901837fe84804fc7c1bce5
          python3 -B scripts/check_worker_review_subject.py --expect-commit a80d14f1bc223e7d20901837fe84804fc7c1bce5 --expect-manifest-sha256 f140380fe8c2a11387316c5b8ed7269cdce239f89592ded26588decf1c42c75e
      - name: Acquire and inspect pinned NoM recovery delta source
        run: |
          git fetch --no-tags --depth=1 origin c560f5dc504818252703fdeaecc2ff96a3f86059 a98dfe7b2fbfc8f8c2b378b34a524e1c1cdff8e7
          python3 -B scripts/check_nom_recovery_delta_subject.py --expect-commit a98dfe7b2fbfc8f8c2b378b34a524e1c1cdff8e7 --expect-manifest-sha256 d08cd8c85c04a0f4bbb8568ef3f87b5302f597686d520b2e208d99b993deb372
      - name: Select macOS OpenSSL verifier
        if: runner.os == 'macOS'
        run: |
          verifier_prefix="$(brew --prefix openssl@3)"
          test -x "$verifier_prefix/bin/openssl"
          printf '%s/bin\n' "$verifier_prefix" >> "$GITHUB_PATH"
      - name: Run offline regression and independent verification
        env:
          REQUIRE_OPENSSL: "1"
        run: |
          set -eu
          if [ "${{ matrix.shard }}" = "all" ]; then
            python3 -m unittest discover -s tests -v
          else
            python3 -B scripts/run_offline_shard.py --shard "${{ matrix.shard }}"
          fi
      - name: Check artifact hygiene
        run: python3 scripts/check_artifacts_batch.py
      - name: Compare missing NoM original custody without reconstruction
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: python3 -B scripts/qualify_nom_partial_custody.py
      - name: Compare selected NoM uncertainty retention without recovery admission
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: python3 -B scripts/qualify_nom_uncertainty.py
      - name: Compare source policy and protected-use cutoffs
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: |
          set -eu
          for policy in cached-read commit-cutoff entry-cutoff rollbackable-ledger; do
            python3 -B scripts/model_policy_source_use.py --policy "$policy"
            python3 -B scripts/model_policy_source_use.py --policy "$policy" --distinct-operations
          done
      - name: Compare original-read delivery and ideal entry boundaries
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: |
          set -eu
          for use in no-entry receipt-entry ideal-current-entry; do
            python3 -B scripts/model_original_read_provenance.py --use "$use"
          done
      - name: Compare bounded original-read consumer retention
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: |
          set -eu
          for policy in replace-witness retained-prefix ideal-nonrollback-prefix; do
            python3 -B -m scripts.model_original_consumer_retention --policy "$policy"
          done
      - name: Record isolated policy-store SQLite runtime
        if: matrix.shard == 'all' || matrix.shard == '0'
        run: python3 -B -m qualification.policy_effect_store

  adaptor-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Fetch locked qualification dependencies
        run: cargo +1.90.0 fetch --locked --manifest-path qualification/Cargo.toml
      - name: Run offline adaptor qualification
        run: cargo +1.90.0 test --locked --offline --manifest-path qualification/Cargo.toml
      - name: Qualify separate public-synthetic native partial journal handoff
        run: cargo +1.90.0 test --locked --offline --manifest-path qualification-native-partial/Cargo.toml
      - name: Build public artifact, completion, authentication, enrollment and observation executables
        run: cargo +1.90.0 build --locked --offline --manifest-path qualification/Cargo.toml --examples
      - name: Qualify fixed-recipient NoM original recovery with the public worker
        run: python3 -B scripts/qualify_nom_recovery.py
      - name: Qualify observation snapshots with the actual public worker
        run: |
          set -eu
          umask 077
          ptlc_snapshot_worker="$GITHUB_WORKSPACE/qualification/target/debug/examples/verify_nom_swap"
          ptlc_snapshot_pin="$(PTLC_SNAPSHOT_WORKER="$ptlc_snapshot_worker" python3 -B -c 'import hashlib, os; from pathlib import Path; print(hashlib.sha256(Path(os.environ["PTLC_SNAPSHOT_WORKER"]).read_bytes()).hexdigest())')"
          ptlc_snapshot_evidence="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-snapshot.XXXXXX")"
          python3 -B scripts/qualify_nom_recovery_snapshot.py \
            --executable "$ptlc_snapshot_worker" --expect-executable-sha256 "$ptlc_snapshot_pin" \
            --evidence "$ptlc_snapshot_evidence"
      - name: Qualify two-phase signed-wire NoM recovery with the public worker
        id: nom_signed_recovery
        run: |
          set -eu
          umask 077
          ptlc_signed_worker="$GITHUB_WORKSPACE/qualification/target/debug/examples/verify_nom_swap"
          ptlc_signed_pin="$(PTLC_SIGNED_WORKER="$ptlc_signed_worker" python3 -B -c 'import hashlib, os; from pathlib import Path; print(hashlib.sha256(Path(os.environ["PTLC_SIGNED_WORKER"]).read_bytes()).hexdigest())')"
          mkdir -p qualification/signed-recovery-evidence
          python3 -B scripts/qualify_nom_signed_recovery.py \
            --executable "$ptlc_signed_worker" --expect-executable-sha256 "$ptlc_signed_pin" \
            --subject-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --evidence "$GITHUB_WORKSPACE/qualification/signed-recovery-evidence"
      - name: Retain exact signed-wire recovery original streams
        if: always() && steps.nom_signed_recovery.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-signed-recovery-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            qualification/signed-recovery-evidence/journals/alice.log
            qualification/signed-recovery-evidence/journals/bob.log
            qualification/signed-recovery-evidence/journals/invalid-wire-control.log
            qualification/signed-recovery-evidence/worker/call-001.stdin
            qualification/signed-recovery-evidence/worker/call-001.stdout
            qualification/signed-recovery-evidence/worker/call-001.stderr
            qualification/signed-recovery-evidence/worker/call-001.receipt.json
            qualification/signed-recovery-evidence/worker/call-002.stdin
            qualification/signed-recovery-evidence/worker/call-002.stdout
            qualification/signed-recovery-evidence/worker/call-002.stderr
            qualification/signed-recovery-evidence/worker/call-002.receipt.json
            qualification/signed-recovery-evidence/worker/call-003.stdin
            qualification/signed-recovery-evidence/worker/call-003.stdout
            qualification/signed-recovery-evidence/worker/call-003.stderr
            qualification/signed-recovery-evidence/worker/call-003.receipt.json
            qualification/signed-recovery-evidence/worker/call-004.stdin
            qualification/signed-recovery-evidence/worker/call-004.stdout
            qualification/signed-recovery-evidence/worker/call-004.stderr
            qualification/signed-recovery-evidence/worker/call-004.receipt.json
            qualification/signed-recovery-evidence/worker/call-005.stdin
            qualification/signed-recovery-evidence/worker/call-005.stdout
            qualification/signed-recovery-evidence/worker/call-005.stderr
            qualification/signed-recovery-evidence/worker/call-005.receipt.json
            qualification/signed-recovery-evidence/worker/call-006.stdin
            qualification/signed-recovery-evidence/worker/call-006.stdout
            qualification/signed-recovery-evidence/worker/call-006.stderr
            qualification/signed-recovery-evidence/worker/call-006.receipt.json
            qualification/signed-recovery-evidence/worker/call-007.stdin
            qualification/signed-recovery-evidence/worker/call-007.stdout
            qualification/signed-recovery-evidence/worker/call-007.stderr
            qualification/signed-recovery-evidence/worker/call-007.receipt.json
            qualification/signed-recovery-evidence/worker/call-008.stdin
            qualification/signed-recovery-evidence/worker/call-008.stdout
            qualification/signed-recovery-evidence/worker/call-008.stderr
            qualification/signed-recovery-evidence/worker/call-008.receipt.json
            qualification/signed-recovery-evidence/worker/call-009.stdin
            qualification/signed-recovery-evidence/worker/call-009.stdout
            qualification/signed-recovery-evidence/worker/call-009.stderr
            qualification/signed-recovery-evidence/worker/call-009.receipt.json
            qualification/signed-recovery-evidence/worker/call-010.stdin
            qualification/signed-recovery-evidence/worker/call-010.stdout
            qualification/signed-recovery-evidence/worker/call-010.stderr
            qualification/signed-recovery-evidence/worker/call-010.receipt.json
            qualification/signed-recovery-evidence/worker/call-011.stdin
            qualification/signed-recovery-evidence/worker/call-011.stdout
            qualification/signed-recovery-evidence/worker/call-011.stderr
            qualification/signed-recovery-evidence/worker/call-011.receipt.json
            qualification/signed-recovery-evidence/worker/call-012.stdin
            qualification/signed-recovery-evidence/worker/call-012.stdout
            qualification/signed-recovery-evidence/worker/call-012.stderr
            qualification/signed-recovery-evidence/worker/call-012.receipt.json
            qualification/signed-recovery-evidence/worker/call-013.stdin
            qualification/signed-recovery-evidence/worker/call-013.stdout
            qualification/signed-recovery-evidence/worker/call-013.stderr
            qualification/signed-recovery-evidence/worker/call-013.receipt.json
            qualification/signed-recovery-evidence/worker/call-014.stdin
            qualification/signed-recovery-evidence/worker/call-014.stdout
            qualification/signed-recovery-evidence/worker/call-014.stderr
            qualification/signed-recovery-evidence/worker/call-014.receipt.json
            qualification/signed-recovery-evidence/worker/call-015.stdin
            qualification/signed-recovery-evidence/worker/call-015.stdout
            qualification/signed-recovery-evidence/worker/call-015.stderr
            qualification/signed-recovery-evidence/worker/call-015.receipt.json
            qualification/signed-recovery-evidence/worker/call-016.stdin
            qualification/signed-recovery-evidence/worker/call-016.stdout
            qualification/signed-recovery-evidence/worker/call-016.stderr
            qualification/signed-recovery-evidence/worker/call-016.receipt.json
            qualification/signed-recovery-evidence/worker/call-017.stdin
            qualification/signed-recovery-evidence/worker/call-017.stdout
            qualification/signed-recovery-evidence/worker/call-017.stderr
            qualification/signed-recovery-evidence/worker/call-017.receipt.json
            qualification/signed-recovery-evidence/worker/call-018.stdin
            qualification/signed-recovery-evidence/worker/call-018.stdout
            qualification/signed-recovery-evidence/worker/call-018.stderr
            qualification/signed-recovery-evidence/worker/call-018.receipt.json
            qualification/signed-recovery-evidence/worker/call-019.stdin
            qualification/signed-recovery-evidence/worker/call-019.stdout
            qualification/signed-recovery-evidence/worker/call-019.stderr
            qualification/signed-recovery-evidence/worker/call-019.receipt.json
            qualification/signed-recovery-evidence/qualification-result.json
            qualification/signed-recovery-evidence/retention-manifest.json
      - name: Qualify six signed-wire process exits with the public worker
        id: nom_signed_process_cuts
        run: |
          set -eu
          umask 077
          ptlc_process_worker="$GITHUB_WORKSPACE/qualification/target/debug/examples/verify_nom_swap"
          ptlc_process_pin="$(PTLC_PROCESS_WORKER="$ptlc_process_worker" python3 -B -c 'import hashlib, os; from pathlib import Path; print(hashlib.sha256(Path(os.environ["PTLC_PROCESS_WORKER"]).read_bytes()).hexdigest())')"
          mkdir -p qualification/signed-process-cut-evidence
          python3 -B scripts/qualify_nom_signed_process_cuts.py \
            --executable "$ptlc_process_worker" --expect-executable-sha256 "$ptlc_process_pin" \
            --subject-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --evidence "$GITHUB_WORKSPACE/qualification/signed-process-cut-evidence"
      - name: Select explicit process-cut original artifact paths
        if: always() && steps.nom_signed_process_cuts.outcome != 'skipped'
        id: nom_signed_process_originals
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from scripts.nom_signed_process_evidence import selected_artifact_names
          root=Path.cwd()
          prefix=Path('qualification/signed-process-cut-evidence')
          selected=selected_artifact_names(root/prefix,root)
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='ascii') as stream:
              stream.write('files<<PTLC_EXPLICIT_PROCESS_ORIGINALS\n')
              for name in selected:stream.write((prefix/name).as_posix()+'\n')
              stream.write('PTLC_EXPLICIT_PROCESS_ORIGINALS\n')
          print('PASS: selected explicit process-cut originals',len(selected))
          PY
      - name: Retain exact signed-wire process-cut original streams
        if: always() && steps.nom_signed_process_originals.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-signed-process-cuts-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ steps.nom_signed_process_originals.outputs.files }}
      - name: Qualify actual public-worker reference-journal interruption custody
        run: python3 -B scripts/qualify_nom_recovery_cuts.py
      - name: Qualify explicit reference-journal process death with the public worker
        run: python3 -B scripts/qualify_nom_process_death.py
      - name: Qualify selected strict read-only result verification with the public worker
        run: python3 -B scripts/qualify_nom_strict_open.py
      - name: Qualify read-only journal partial HOLD projection with the public worker
        run: python3 -B scripts/qualify_nom_journal_hold.py
      - name: Qualify create-only full projection capsule custody with the public worker
        run: python3 -B scripts/qualify_nom_capsule.py
      - name: Compare retained capsule journal continuity with the public worker
        run: python3 -B scripts/qualify_nom_capsule_continuity.py
      - name: Bind retained capsule originals and unknown work to the separate source read
        run: python3 -B scripts/qualify_nom_capsule_query.py
      - name: Verify historical NoM source and custody role signatures
        run: python3 -B scripts/qualify_nom_source_checkpoint.py
      - name: Compare selected NoM external checkpoint reference transitions
        run: python3 -B scripts/qualify_nom_checkpoint_protocol.py
      - name: Compare minimum-bound NoM checkpoint discovery and complete evidence openings
        run: python3 -B scripts/qualify_nom_checkpoint_discovery.py
      - name: Verify selected NoM checkpoint response role and public signatures
        run: python3 -B scripts/qualify_nom_checkpoint_response.py
      - name: Verify reference NoM checkpoint read order and retained prefixes
        run: python3 -B scripts/qualify_nom_checkpoint_read_ordering.py
      - name: Verify reference NoM anchor lifecycle and lost acknowledgments
        run: python3 -B scripts/qualify_nom_anchor_lifecycle.py
      - name: Verify selected NoM anchor transition retention and restart refusals
        run: python3 -B scripts/qualify_nom_anchor_transition_journal.py
      - name: Qualify public recovery with computed Create context ids
        run: python3 -B scripts/qualify_nom_created_recovery.py
      - name: Record selected offline dependency and worker input evidence
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          ptlc_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_cc="$(command -v cc)"
          python3 -B scripts/qualify_build_inputs.py --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --cargo "$ptlc_cargo" --rustc "$ptlc_rustc" --c-compiler "$ptlc_cc" --original-response-worker qualification/target/debug/examples/verify_original_read_response
      - name: Compare locked Cargo archives and pinned Git checkout contents
        run: python3 -B scripts/qualify_dependency_contents.py --cargo-home "${CARGO_HOME:-$HOME/.cargo}"
      - name: Compare selected Cargo resolution records against fixed source baseline
        run: |
          ptlc_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          ptlc_resolution_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_resolution_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          for ptlc_platform in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            ptlc_resolution_workspace="$(mktemp -d "$RUNNER_TEMP/ptlc-cargo-resolution.XXXXXX")"
            python3 -B scripts/prepare_cargo_resolution.py --output "$ptlc_resolution_workspace"
            CARGO_HOME="$ptlc_cargo_home" CARGO_NET_OFFLINE=true RUSTC="$ptlc_resolution_rustc" \
              "$ptlc_resolution_cargo" metadata --locked --offline --format-version 1 \
              --manifest-path "$ptlc_resolution_workspace/qualification/Cargo.toml" \
              --filter-platform "$ptlc_platform" > "$ptlc_resolution_workspace/metadata.json"
            python3 -B scripts/qualify_cargo_resolution.py --workspace "$ptlc_resolution_workspace" \
              --metadata "$ptlc_resolution_workspace/metadata.json" \
              --cargo-home "$ptlc_cargo_home" --platform "$ptlc_platform"
          done
      - name: Compare fresh selected worker build claims and exercise its public math
        run: |
          set -eu
          ptlc_worker_workspace="$(mktemp -d "$RUNNER_TEMP/ptlc-worker-source.XXXXXX")"
          ptlc_worker_build="$(mktemp -d "$RUNNER_TEMP/ptlc-worker-build.XXXXXX")"
          ptlc_worker_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_worker_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_worker_cc="$(command -v cc)"
          python3 -B scripts/qualify_worker_build.py --workspace "$ptlc_worker_workspace" \
            --build-directory "$ptlc_worker_build" --cargo-home "${CARGO_HOME:-$HOME/.cargo}" \
            --platform x86_64-unknown-linux-gnu --cargo "$ptlc_worker_cargo" \
            --rustc "$ptlc_worker_rustc" --c-compiler "$ptlc_worker_cc"
          python3 -B scripts/qualify_original_read_response.py \
            --original-response-verifier "$ptlc_worker_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
      - name: Compare two target-only Rust remapping builds and their separate public math
        run: |
          set -eu
          set -o pipefail
          ptlc_section_carrier="$(mktemp "$RUNNER_TEMP/ptlc-section-carrier.XXXXXX")"
          trap 'rm -f "$ptlc_section_carrier"' EXIT
          ptlc_remap_first_source="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-source-a.XXXXXX")"
          ptlc_remap_first_build="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-build-a.XXXXXX")"
          ptlc_remap_second_source="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-source-b.XXXXXX")"
          ptlc_remap_second_build="$(mktemp -d "$RUNNER_TEMP/ptlc-remap-build-b.XXXXXX")"
          ptlc_remap_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_remap_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_remap_cc="$(command -v cc)"
          python3 -B scripts/qualify_worker_remapping.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_remap_cargo" --rustc "$ptlc_remap_rustc" --c-compiler "$ptlc_remap_cc" | tee "$ptlc_section_carrier"
          for ptlc_remap_build in "$ptlc_remap_first_build" "$ptlc_remap_second_build"; do
            python3 -B scripts/qualify_original_read_response.py \
              --original-response-verifier "$ptlc_remap_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
          done
          python3 -B scripts/qualify_worker_sections.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          python3 -B scripts/qualify_worker_symbols.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          python3 -B scripts/qualify_worker_debug_names.py \
            --first-workspace "$ptlc_remap_first_source" --first-build-directory "$ptlc_remap_first_build" \
            --second-workspace "$ptlc_remap_second_source" --second-build-directory "$ptlc_remap_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_section_carrier"
          ptlc_c_carrier="$(mktemp "$RUNNER_TEMP/ptlc-c-carrier.XXXXXX")"
          chmod 600 "$ptlc_c_carrier"
          trap 'rm -f "$ptlc_section_carrier" "$ptlc_c_carrier"' EXIT
          ptlc_c_first_source="$(mktemp -d "$RUNNER_TEMP/ptlc-c-source-a.XXXXXX")"
          ptlc_c_first_build="$(mktemp -d "$RUNNER_TEMP/ptlc-c-build-a.XXXXXX")"
          ptlc_c_second_source="$(mktemp -d "$RUNNER_TEMP/ptlc-c-source-b.XXXXXX")"
          ptlc_c_second_build="$(mktemp -d "$RUNNER_TEMP/ptlc-c-build-b.XXXXXX")"
          python3 -B scripts/qualify_worker_c_debug.py \
            --first-workspace "$ptlc_c_first_source" --first-build-directory "$ptlc_c_first_build" \
            --second-workspace "$ptlc_c_second_source" --second-build-directory "$ptlc_c_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_remap_cargo" --rustc "$ptlc_remap_rustc" --c-compiler "$ptlc_remap_cc" | tee "$ptlc_c_carrier"
          for ptlc_c_build in "$ptlc_c_first_build" "$ptlc_c_second_build"; do
            python3 -B scripts/qualify_original_read_response.py \
              --original-response-verifier "$ptlc_c_build/x86_64-unknown-linux-gnu/debug/examples/verify_original_read_response"
          done
          python3 -B scripts/qualify_worker_c_symbols.py \
            --first-workspace "$ptlc_c_first_source" --first-build-directory "$ptlc_c_first_build" \
            --second-workspace "$ptlc_c_second_source" --second-build-directory "$ptlc_c_second_build" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --private-pair-report "$ptlc_c_carrier"
      - name: Qualify durable exchange with the actual public verifier
        run: python3 -B scripts/qualify_exchange.py --verifier qualification/target/debug/examples/verify_exchange
      - name: Qualify public completion and recovery with separate journals
        run: python3 -B scripts/qualify_completion.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify pinned completion envelopes and their admission limits
        run: python3 -B scripts/qualify_authentication.py --authentication qualification/target/debug/examples/verify_authentication --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify public enrollment signatures and their authority limits
        run: python3 -B scripts/qualify_enrollment_signature.py --enrollment qualification/target/debug/examples/verify_enrollment --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify local governor profiles and their bootstrap limits
        run: python3 -B scripts/qualify_governor_profile.py --enrollment qualification/target/debug/examples/verify_enrollment --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify public issuer and v2 owner signatures without current authority
        run: python3 -B scripts/qualify_governor_signature.py --governor qualification/target/debug/examples/verify_governor --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Replay selected recovery model traces against actual public workers
        run: python3 -B scripts/qualify_recovery_model.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange
      - name: Qualify exact normal observation verdicts and unavailable work
        run: python3 -B scripts/qualify_observation.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify bounded observation records with actual verdicts and unknown work
        run: python3 -B scripts/qualify_observation_records.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify separately owned observation storage and actual result-loss recovery
        run: python3 -B scripts/qualify_observation_store.py --verifier qualification/target/debug/examples/verify_exchange --completion qualification/target/debug/examples/complete_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify explicit Linux CPU and address-space limits with actual observation work
        run: python3 -B scripts/qualify_worker_resources.py --verifier qualification/target/debug/examples/verify_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify durable Linux policy, death, storage failures and restore limits
        run: python3 -B scripts/qualify_observation_resource_store.py --verifier qualification/target/debug/examples/verify_exchange --observation qualification/target/debug/examples/verify_observation
      - name: Qualify selected historical source root roles without provisioning
        run: python3 -B scripts/qualify_source_root_roles.py --root-verifier qualification/target/debug/examples/verify_source_root
      - name: Qualify selected historical administrator commands without source mutation
        run: python3 -B scripts/qualify_source_admin_command.py --admin-verifier qualification/target/debug/examples/verify_source_admin
      - name: Qualify selected checkpoint response signatures without current authority
        run: python3 -B scripts/qualify_source_response.py --response-verifier qualification/target/debug/examples/verify_source_response
      - name: Qualify selected historical original-read root and response signatures
        run: python3 -B scripts/qualify_original_read_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only owned original snapshots with historical signature mathematics
        run: python3 -B scripts/qualify_original_read_snapshot_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only signed retained prefixes and forked futures
        run: python3 -B scripts/qualify_original_snapshot_prefix_response.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only owned witness transactions and copied-state limits
        run: python3 -B scripts/qualify_original_witness_store.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Qualify test-only witness creation and interruption lifecycle
        run: python3 -B scripts/qualify_original_witness_lifecycle.py --original-response-verifier qualification/target/debug/examples/verify_original_read_response
      - name: Check Rust formatting
        run: cargo +1.90.0 fmt --manifest-path qualification/Cargo.toml -- --check
      - name: Check separate public-synthetic handoff formatting
        run: cargo +1.90.0 fmt --manifest-path qualification-native-partial/Cargo.toml -- --check

  nom-worker-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Acquire and check the separate immutable NoM worker source
        run: |
          git fetch --no-tags --depth=1 origin c560f5dc504818252703fdeaecc2ff96a3f86059
          python3 -B scripts/check_nom_worker_subject.py \
            --expect-commit c560f5dc504818252703fdeaecc2ff96a3f86059 \
            --expect-manifest-sha256 59d9b134d4be55f3dc98797529aff86d121fdce3d0e2ddce8dfd7b9c171cf179
      - name: Acquire selected native toolchain and locked dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path qualification/Cargo.toml
      - name: Build fresh native NoM worker and exercise empty-environment public recovery
        run: |
          set -eu
          umask 077
          ptlc_nom_source="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-source.XXXXXX")"
          ptlc_nom_build="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-build.XXXXXX")"
          ptlc_nom_evidence="$(mktemp -d "$RUNNER_TEMP/ptlc-nom-evidence.XXXXXX")"
          ptlc_nom_cargo="$(rustup which --toolchain 1.90.0 cargo)"
          ptlc_nom_rustc="$(rustup which --toolchain 1.90.0 rustc)"
          ptlc_nom_cc="$(command -v cc)"
          python3 -B scripts/qualify_nom_worker.py --workspace "$ptlc_nom_source" \
            --build-directory "$ptlc_nom_build" --evidence "$ptlc_nom_evidence" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --platform x86_64-unknown-linux-gnu \
            --cargo "$ptlc_nom_cargo" --rustc "$ptlc_nom_rustc" --c-compiler "$ptlc_nom_cc"
      - name: Qualify fixture-only signed-wire I/O fault boundaries
        id: io-faults
        shell: bash
        run: |
          set -eu
          umask 077
          python3 -B - <<'PY'
          import json
          import os
          import shutil
          floor, reservation = 10 * 1024**3, 32 * 1024**2
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < floor + reservation:
              raise SystemExit('REFUSED: finite I/O profile free-space admission')
          print(json.dumps(dict(scope='NEW ISOLATED HOSTED I/O PROFILE ONLY',
              free_space_floor=floor, expected_reservation=reservation,
              evidence_limit=8*1024**2, os_filesystem_quota='NOT CLAIMED')))
          PY
          git fetch --no-tags --depth=1 origin '${{ github.event.pull_request.head.sha || github.sha }}'
          ptlc_io_root="$(mktemp -d "$RUNNER_TEMP/ptlc-io-faults.XXXXXX")"
          mkdir "$ptlc_io_root/evidence"
          printf 'PTLC_IO_PROFILE_ROOT=%s\n' "$ptlc_io_root" >> "$GITHUB_ENV"
          python3 -B scripts/qualify_nom_signed_io_faults.py --evidence "$ptlc_io_root/evidence" \
            --subject-commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Check explicit I/O fault original selection
        id: io-selection
        if: always() && env.PTLC_IO_PROFILE_ROOT != ''
        shell: bash
        run: |
          set -eu
          if [ '${{ steps.io-faults.outcome }}' = 'success' ]; then
            python3 -B scripts/qualify_nom_signed_io_faults.py --evidence "$PTLC_IO_PROFILE_ROOT/evidence" \
              --artifact-files > "$PTLC_IO_PROFILE_ROOT/selected-files"
          else
            python3 -B scripts/qualify_nom_signed_io_faults.py --evidence "$PTLC_IO_PROFILE_ROOT/evidence" \
              --artifact-files --allow-incomplete-for-retention > "$PTLC_IO_PROFILE_ROOT/selected-files"
          fi
          {
            printf 'files<<PTLC_IO_SELECTED_FILES\n'
            while IFS= read -r member; do
              printf '%s/evidence/%s\n' "$PTLC_IO_PROFILE_ROOT" "$member"
            done < "$PTLC_IO_PROFILE_ROOT/selected-files"
            printf 'PTLC_IO_SELECTED_FILES\n'
          } >> "$GITHUB_OUTPUT"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.qualify_nom_signed_io_faults import selected_artifact_names
          directory = Path(os.environ['PTLC_IO_PROFILE_ROOT'])/'evidence'
          names = selected_artifact_names(directory, allow_incomplete=True)
          print(json.dumps(dict(selected_original_files=len(names),
              selection='EXPLICIT_RELATIVE_NAMES_ONLY', publication_scope='FIXTURE_ONLY',
              application='NO-GO', core='NO-GO', independent_assessment='UNFILLED')))
          PY
      - name: Preserve this attempt's checked I/O fault originals
        if: always() && steps.io-selection.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nom-signed-io-faults-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.io-selection.outputs.files }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          archive: true

  go-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [qualification-go, qualification-bitcoin-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned compatibility toolchain
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/ptlc-go.tar.gz"
          curl --fail --silent --show-error --location https://go.dev/dl/go1.23.12.linux-amd64.tar.gz --output "$archive"
          printf '%s  %s\n' d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90 "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ptlc-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ptlc-go"
          printf '%s\n' "$RUNNER_TEMP/ptlc-go/go/bin" >> "$GITHUB_PATH"
      - name: Fetch recorded Go dependencies
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
          GODEBUG: "http2client=0"
        run: |
          ptlc_module_copy="$(mktemp -d "$RUNNER_TEMP/ptlc-go-inputs.XXXXXX")"
          cp go.mod go.sum "$ptlc_module_copy/"
          (
            cd "$ptlc_module_copy"
            go mod download all
          )
      - name: Run offline Go qualification
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test -mod=readonly -count=1 -v ./...
      - name: Compare declared Go module contents against fixed sums
        run: |
          git fetch --no-tags --depth=1 origin bd4b4b523fb3453e2af191eb01973985d6431d66
          ptlc_go_cache="$(go env GOMODCACHE)"
          python3 -B scripts/qualify_dependency_contents.py --go-cache "$ptlc_go_cache" --go-module "${{ matrix.module }}"
      - name: Check Go formatting
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"


