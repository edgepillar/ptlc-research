[package]
name = "ptlc-nom-public-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Candidate public-only NoM presignature verification"

[dependencies]
schnorr_fun = { git = "https://github.com/LLFourn/secp256kfun", rev = "74d18bbf864f98e5cf7c18dcfb74ba1ecfe837ce", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[[test]]
name = "client_public_crypto_process"
path = "../qualification/tests/client_public_crypto_process.rs"
